include: package:very_good_analysis/analysis_options.yaml
analyzer:
  exclude:
    - lib/l10n/gen/*
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Freezed 3.x uses @JsonKey on constructor params which is valid
    invalid_annotation_target: ignore
linter:
  rules:
    public_member_api_docs: false
    # FutureProvider.family returns an internal type (FutureProviderFamily)
    # that isn't exported from the public API
    specify_nonobvious_property_types: false
