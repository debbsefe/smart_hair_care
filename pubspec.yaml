name: smart_hair_care
description: A Smart Hair Care app for tracking products, daily routines, hair profile, and experiments.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ^3.38.0

dependencies:
  # Database - Drift (SQLite)
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  # Utilities
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State Management - Riverpod 3
  flutter_riverpod: ^3.0.3
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.2
  riverpod_annotation: ^4.0.0
  uuid: ^4.3.3

dev_dependencies:
  # Code generation
  build_runner: ^2.10.5
  custom_lint: ^0.8.0
  drift_dev: ^2.29.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.0.3
  very_good_analysis: ^10.0.0

flutter:
  generate: true
  uses-material-design: true
